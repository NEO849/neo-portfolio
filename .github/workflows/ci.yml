name: CI

# Senior-Elite Quality-Gate:
#   · TypeScript-Check (tsc --noEmit)
#   · Smoke-Tests (vitest)
#   · Production-Build (tsc -b && vite build)
# Läuft auf PRs gegen main und auf jedem Push nach main.
# Required-Check in GitHub-Branch-Protection für main empfohlen.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Verhindert dass mehrere CI-Runs auf demselben Branch parallel laufen
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies (clean)
        run: npm ci --no-audit --no-fund

      - name: TypeScript Type-Check
        run: npx tsc --noEmit

      - name: Run Tests
        run: npm test -- --run

      - name: Production Build
        run: npm run build

      - name: Verify Build Output
        run: |
          test -f dist/index.html || (echo "::error::dist/index.html missing"; exit 1)
          test -d dist/assets || (echo "::error::dist/assets missing"; exit 1)
          echo "✓ Build artifacts present"
          du -sh dist/

  # Eigener Job, damit Audit-Signal vom Build-/Test-Signal getrennt sichtbar ist.
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies (clean)
        run: npm ci --no-audit --no-fund

      # Harter Gate: NUR Production-Deps (das, was an Nutzer ausgeliefert wird).
      # Bricht bei High/Critical — Dev-Tooling-Advisories blockieren das Deploy nicht.
      - name: Audit production dependencies (fail on high/critical)
        run: npm audit --omit=dev --audit-level=high

      # Voller Audit inkl. Dev-Deps — nur informativ, blockiert nicht.
      - name: Full audit (informational)
        run: npm audit || true

  # Python-Backend-Deps (api/requirements.txt) auf bekannte CVEs prüfen.
  # Schließt die Lücke: npm audit deckt nur das Frontend (Pillow/httpx/fastapi
  # blieben sonst ungescannt).
  python-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      # Gate auf die direkten Backend-Deps. Bricht bei bekannten CVEs.
      - name: Audit api/requirements.txt
        run: pip-audit -r api/requirements.txt --desc

  # Secret-Scan über den gesamten Verlauf — fängt versehentlich committete
  # Keys, bevor sie ins Repo gelangen (.gitignore allein ist kein Schutz).
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
