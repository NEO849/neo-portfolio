name: CI

# Senior-Elite Quality-Gate:
#   · TypeScript-Check (tsc --noEmit)
#   · Smoke-Tests (vitest)
#   · Production-Build (tsc -b && vite build)
# Läuft auf PRs gegen main und auf jedem Push nach main.
# Required-Check in GitHub-Branch-Protection für main empfohlen.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Verhindert dass mehrere CI-Runs auf demselben Branch parallel laufen
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies (clean)
        run: npm ci --no-audit --no-fund

      - name: TypeScript Type-Check
        run: npx tsc --noEmit

      - name: Run Tests
        run: npm test -- --run

      - name: Production Build
        run: npm run build

      - name: Verify Build Output
        run: |
          test -f dist/index.html || (echo "::error::dist/index.html missing"; exit 1)
          test -d dist/assets || (echo "::error::dist/assets missing"; exit 1)
          echo "✓ Build artifacts present"
          du -sh dist/
